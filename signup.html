<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><div class="mark">L</div><div class="name">Ledger<span>.</span></div></a>
    <div class="nav-actions">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">☀️</button>
    </div>
  </div>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <a class="back-link" href="index.html">&larr; Back to home</a>
    <div class="auth-tabs">
      <a class="auth-tab" style="display:block" href="login.html">Log in</a>
      <div class="auth-tab active">Sign up</div>
    </div>
    <form id="signup-form" onsubmit="return handleSignup(event)">
      <div class="field-row">
        <div class="field"><label for="su-name">Full name</label><input type="text" id="su-name" placeholder="Jordan Ali" required></div>
        <div class="field"><label for="su-region">Country</label>
          <select id="su-region" required>
            <option value="">Select your country</option>
            <option>Pakistan</option><option>United States</option><option>United Kingdom</option><option>United Arab Emirates</option>
            <option>Canada</option><option>Australia</option><option>Germany</option><option>India</option><option>Nigeria</option>
            <option>Brazil</option><option>Philippines</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="field"><label for="su-email">Email</label><input type="email" id="su-email" placeholder="name@example.com" required></div>
      <div class="field"><label for="su-phone">Phone number</label><input type="tel" id="su-phone" placeholder="+92 300 1234567" required></div>
      <div class="field-row">
        <div class="field"><label for="su-pass">Password</label><input type="password" id="su-pass" placeholder="Min. 8 characters" required minlength="8"></div>
        <div class="field"><label for="su-pass2">Confirm password</label><input type="password" id="su-pass2" placeholder="Repeat password" required></div>
      </div>
      <div class="field"><label for="su-plan">Plan</label>
        <select id="su-plan"><option value="basic">Basic — free</option><option value="pro">Pro — $9/mo</option><option value="premium">Premium — $24/mo</option></select>
      </div>
      <div class="error-text" id="signup-error">Passwords don't match.</div>
      <button type="submit" class="btn btn-primary btn-block">Create account<span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span></button>
    </form>
    <div class="auth-note">Billing isn't wired up yet, so any plan selected here is applied without payment for now. You'll get a confirmation email — check your inbox after signing up.</div>
  </div>
</div>

<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script>
(function preselectPlan(){
  const params = new URLSearchParams(window.location.search);
  const plan = params.get('plan');
  if(plan){ document.getElementById('su-plan').value = plan; }
})();

async function handleSignup(e){
  e.preventDefault();
  const p1 = document.getElementById('su-pass').value;
  const p2 = document.getElementById('su-pass2').value;
  const err = document.getElementById('signup-error');
  if(p1 !== p2 || p1.length < 8){
    err.textContent = "Passwords don't match, or are under 8 characters.";
    err.classList.add('show'); return false;
  }
  err.classList.remove('show');

  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.textContent = 'Creating account…';

  const { error } = await signUpUser({
    name: document.getElementById('su-name').value.trim(),
    country: document.getElementById('su-region').value,
    phone: document.getElementById('su-phone').value.trim(),
    email: document.getElementById('su-email').value.trim(),
    password: p1,
    plan: document.getElementById('su-plan').value
  });

  btn.disabled = false; btn.innerHTML = 'Create account<span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>';

  if(error){
    err.textContent = error.message;
    err.classList.add('show');
    return false;
  }

  // If email confirmation is required, there's no session yet — send them to check inbox.
  const session = await getCurrentSession();
  if(session){
    window.location.href = 'dashboard.html';
  } else {
    document.querySelector('.auth-card').innerHTML = `
      <a class="back-link" href="index.html">&larr; Back to home</a>
      <h3 class="font-display" style="margin-top:0;">Check your email</h3>
      <p style="color:var(--text-soft);font-size:14px;line-height:1.6;">We've sent a confirmation link to your email. Click it to activate your account, then come back and log in.</p>
      <a class="btn btn-primary btn-block" href="login.html" style="margin-top:16px;">Go to login</a>`;
  }
  return false;
}
</script>
</body>
</html>
